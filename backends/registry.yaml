muse_glimmer_local:
  provider: openai_compat
  base_url: "http://localhost:8080/v1"
  model_name: "Muse-Glimmer-30B-GGUF"
  parameters:
    temperature: 0.1
    max_tokens: 4096
    extra_body:
      speculative_drafter: "DFlash"
      sliding_window_attention: true
      kv_cache_type: "q8_0"

qwen3_8_27b_local:
  provider: llama.cpp
  base_url: "http://localhost:8080/v1"
  model_name: "qwen3.8-27b"
  parameters:
    temperature: 1.0
    top_p: 0.95
    max_tokens: 16384
    extra_body:
      spec_type: "ngram-mod,draft-mtp"
      spec_draft_n_max: 2
      kv_cache_type: "q4_1"


