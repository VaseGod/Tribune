# TRIBUNE backend registry
#
# A machine-readable catalog of candidate model backends for the proposer and
# verifier roles. Inclusion criteria and how the measured slots get populated are
# documented in backends/README.md. Validate with:
#
#     python scripts/validate_registry.py                 # schema only (CI)
#     python scripts/validate_registry.py --check-links   # + weight-URL HEAD checks
#
# Honesty rules encoded here:
#   * weights_status: downloadable vs. announced_only — announced-only models are
#     NOT deployable; do not treat them as available.
#   * weights_verified stays false until a link check confirms the URL resolves.
#   * measured_kappa / measured_cost_per_task are null until populated from a
#     TRIBUNE eval run on the frozen seed set (never hand-entered vibes).
#   * cost is judged as cost-per-verified-determination, never list price.

version: 1
seed_set: tribune-quant-seed-set          # the frozen 50-case set (Phase 2)
default_workhorse: gemini-3.7-flash

providers:
  gemini-3.7-flash:
    provider_type: openai_compat
    model_name: gemini-3.7-flash
    input_cost_per_1m: 0.75
    output_cost_per_1m: 3.75
    max_context_tokens: 1048576
    supports_tools: true
  gpt-5.6-sol-ultrafast:
    provider_type: openai_compat
    model_name: gpt-5.6-sol-ultrafast
    input_cost_per_1m: 2.50
    output_cost_per_1m: 10.00
    tokens_per_second: 750
    supports_tools: true
  qwen3.8-27b:
    provider_type: llama.cpp
    model_name: qwen3.8-27b
    input_cost_per_1m: 0.10
    output_cost_per_1m: 0.20
    max_context_tokens: 131072
    supports_tools: true
    spec_type: ngram-mod,draft-mtp
    spec_draft_max: 2
    kv_quant_type: q4_1

candidates:
  - candidate_id: qwen3.8-27b
    name: Qwen 3.8 27B
    vendor: Alibaba
    params: "27B"
    roles: [proposer, verifier]
    role_note: primary dense local frontier model for ReasonMaxxer long-context processing
    license: open-weights
    weights_status: downloadable
    weights_url: https://huggingface.co/Qwen/Qwen3.8-27B
    weights_verified: false
    serving: [llama.cpp]
    quant_formats: [gguf-q8_0, gguf-q4_k_m, gguf-q3_k_xl, q4_1]
    context_window: 131072
    measured_kappa: null
    measured_cost_per_task: null
    notes: >-
      Primary dense local frontier model configured for ReasonMaxxer sparse reasoning
      with MTP speculative decoding (spec-type: ngram-mod,draft-mtp, spec-draft-n-max: 2)
      and q4_1 KV cache quantization to fit 73k+ token context in 16GB VRAM.

  - candidate_id: glm-5.2
    name: GLM-5.2
    vendor: Zhipu AI
    params: "753B (MoE)"
    roles: [verifier, proposer]
    role_note: incumbent verifier candidate
    license: open-weights
    weights_status: downloadable
    weights_url: https://huggingface.co/zai-org/GLM-5.2
    weights_verified: false
    serving: [vllm, sglang, llama.cpp]
    quant_formats: [fp16, fp8, gguf-q8_0, gguf-q4_k_m, gguf-q2_k, gguf-iq1_s]
    context_window: 131072
    measured_kappa: null
    measured_cost_per_task: null
    notes: >-
      Runs usable inference at ~2-bit effective quantization on commodity
      hardware; whether verifier calibration survives that quant level is exactly
      what Eval Note #1 measures.

  - candidate_id: deepseek-v4
    name: DeepSeek V4
    vendor: DeepSeek
    params: "unconfirmed"
    roles: [verifier, proposer]
    license: open-weights
    weights_status: downloadable
    weights_url: https://huggingface.co/deepseek-ai/DeepSeek-V4
    weights_verified: false
    serving: [vllm, sglang, llama.cpp]
    quant_formats: [fp8, gguf-q4_k_m, gguf-q2_k]
    context_window: 131072
    measured_kappa: null
    measured_cost_per_task: null
    notes: >-
      llama.cpp support recently merged; GGUF quant availability still maturing —
      verify quant files exist before relying on a given rung.

  - candidate_id: openpangu-2-flash-92b
    name: OpenPangu-2.0-Flash 92B
