[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tribune"
version = "0.1.0"
description = "Verification-first, self-hostable AI assistant for accessing public benefits people are legally entitled to."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "The TRIBUNE contributors" }]
keywords = ["public-benefits", "SNAP", "Medicaid", "unemployment", "housing", "verification", "abstention", "rag"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core deps only. Everything heavy (served models, hosted vector store, OCR,
# tracing) is optional and sits behind an interface with a working local fallback.
dependencies = [
  "pydantic==2.8.2",
  "pydantic-settings==2.4.0",
  "numpy==1.26.4",
]

[project.optional-dependencies]
served = ["httpx==0.27.2"]          # convenience client for OpenAI-compatible endpoints (stdlib urllib also works)
tracing = ["weave==0.51.1"]         # W&B Weave instrumentation (silent no-op if absent)
web = ["fastapi==0.115.0", "uvicorn[standard]==0.30.6"]  # the web UI backend (`tribune web`)
dev = [
  "pytest==8.3.2",
  "ruff==0.6.4",
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "httpx==0.27.2",                  # required by FastAPI's TestClient
]

[project.scripts]
tribune = "tribune.cli:main"

[project.urls]
Homepage = "https://github.com/tribune-project/tribune"
Source = "https://github.com/tribune-project/tribune"
Issues = "https://github.com/tribune-project/tribune/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tribune*"]

[tool.setuptools.package-data]
tribune = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]
