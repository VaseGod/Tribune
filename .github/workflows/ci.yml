name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check tribune tests

      - name: Tests (pytest)
        run: pytest -q

      - name: Smoke — demo and eval must run clean and exit 0
        run: |
          tribune demo
          tribune eval --n 8
          tribune canary

      - name: Smoke — quant-sensitivity ladder (2 mock rungs, ~5 cases)
        run: tribune quant-eval --smoke --out /tmp/quant_smoke_note.md

      - name: Red-team — ingestion injection probe must pass
        run: tribune redteam

      - name: Validate backend registry (schema only; link check is opt-in)
        run: python scripts/validate_registry.py

      - name: Sandboxed appeals eval — must run with zero network egress
        run: python -m tribune.eval.appeals_eval --n 8
