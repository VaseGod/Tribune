# TRIBUNE Pipeline YAML Configuration File

provider: "local_rules"

openai:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"

anthropic:
  base_url: "https://api.anthropic.com/v1"
  model: "claude-3-5-sonnet-20241022"

deepseek:
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-v4-flash"
  reasoning_effort: "medium"

vllm:
  base_url: "http://localhost:8000/v1"
  model: "Qwen/Qwen2.5-7B-Instruct"

local_fallback:
  url: "http://localhost:8001/v1"
  model: "local-quant-moe-3bit"
  enabled: true

static_analysis:
  semgrep_binary: "semgrep"
  timeout_s: 30.0

pricing:
  path: "tribune/eval/pricing.json"

tribune:
  context:
    edge_confidence_threshold: 0.85
    enable_non_autoregressive_router: true
    escalation_queue_name: "context_escalation"
  memory:
    window_size: 2048
    eviction_policy: "calibrated_kernel"
    token_budget: 32000
  audio:
    enable_full_duplex: true
    interruption_flush_target_ms: 50
    turn_latency_target_ms: 300
  adapters:
    enable_dynamic_mova_router: true
    max_active_experts: 2
    cache_budget_mb: 1024
  sandbox:
    default_mode: "shell_first"
    allow_shell: true
    allow_network: false
    max_execution_seconds: 120
    max_memory_mb: 1024

